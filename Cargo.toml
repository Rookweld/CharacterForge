[workspace]
resolver = "3"
members = [
  "apps/desktop/src-tauri",
  "crates/app-core",
  "crates/storage",
  "crates/export",
  "crates/contracts",
]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
version = "1.0.0"

[workspace.dependencies]
blake3 = "=1.8.5"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
